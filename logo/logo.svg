<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1526"/>
      <stop offset="1" stop-color="#131F38"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#6D8BFF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#0E1930"/>
    </linearGradient>
    <linearGradient id="net" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- 徽章底 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#badge)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#1E2C4A" stroke-width="2"/>

  <!-- 天线：接收 / 分发的信号 -->
  <g stroke="url(#frame)" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M256 152 L198 92"/>
    <path d="M256 152 L314 92"/>
  </g>
  <circle cx="192" cy="86" r="11" fill="#7DD3FC" filter="url(#glow)"/>
  <circle cx="320" cy="86" r="11" fill="#A78BFA" filter="url(#glow)"/>

  <!-- TV 机身 -->
  <rect x="92" y="150" width="328" height="226" rx="40" fill="#0F1930" stroke="url(#frame)" stroke-width="10"/>
  <!-- 屏幕 -->
  <rect x="122" y="180" width="268" height="166" rx="26" fill="url(#screen)" stroke="#22304F" stroke-width="3"/>

  <!-- AI 神经网络：中枢 + 语义节点 -->
  <g stroke="url(#net)" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M256 263 L188 216"/>
    <path d="M256 263 L324 216"/>
    <path d="M256 263 L188 310"/>
    <path d="M256 263 L324 310"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="256" cy="263" r="27" fill="#0B1424" stroke="url(#net)" stroke-width="7"/>
    <circle cx="256" cy="263" r="9" fill="#7DD3FC"/>
    <circle cx="188" cy="216" r="13" fill="#0B1424" stroke="#7DD3FC" stroke-width="5"/>
    <circle cx="324" cy="216" r="13" fill="#0B1424" stroke="#A78BFA" stroke-width="5"/>
    <circle cx="188" cy="310" r="13" fill="#0B1424" stroke="#A78BFA" stroke-width="5"/>
    <circle cx="324" cy="310" r="13" fill="#0B1424" stroke="#7DD3FC" stroke-width="5"/>
  </g>

  <!-- 共享社区：成员节点互连并向 TV 供流 -->
  <g stroke="url(#warm)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M256 392 C 220 402, 190 408, 158 420"/>
    <path d="M256 392 L 256 428"/>
    <path d="M256 392 C 292 402, 322 408, 354 420"/>
  </g>
  <ellipse cx="256" cy="386" rx="16" ry="6" fill="#FBBF24" opacity="0.28" filter="url(#softglow)"/>
  <g filter="url(#glow)">
    <circle cx="152" cy="424" r="13" fill="#0B1424" stroke="url(#warm)" stroke-width="5"/>
    <circle cx="256" cy="440" r="15" fill="#0B1424" stroke="url(#warm)" stroke-width="5"/>
    <circle cx="360" cy="424" r="13" fill="#0B1424" stroke="url(#warm)" stroke-width="5"/>
  </g>
  <g fill="#FCD34D">
    <circle cx="152" cy="424" r="4"/>
    <circle cx="256" cy="440" r="4.5"/>
    <circle cx="360" cy="424" r="4"/>
  </g>

  <!-- 机身底部指示 -->
  <rect x="228" y="396" width="56" height="8" rx="4" fill="#22314F"/>
</svg>
